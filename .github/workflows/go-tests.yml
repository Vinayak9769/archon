name: Go Tests

on:
  pull_request:
    branches: [ main, master ]
    types: [ opened, synchronize, reopened ]

jobs:
  test:
    name: Run Go Service Unit Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: vinayak123
          POSTGRES_DB: archon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'gateway/go.mod'

      - name: Install Go dependencies
        run: |
          cd gateway
          go mod download

      - name: Run Go unit tests
        env:
          TEST_DATABASE_URL: postgres://postgres:vinayak123@localhost:5432/archon_test?sslmode=disable
        run: |
          cd gateway
          go test -v ./...
